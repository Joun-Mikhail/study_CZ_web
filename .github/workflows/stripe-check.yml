name: Stripe price check

# Compares every Stripe Payment Link with src/config/pricing.ts (price,
# currency, tax off, promo codes, LAUNCH50) using a read-only key.
# Secret: STRIPE_READ_KEY (restricted key, read access only).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (07:00/08:00 Prague)
  workflow_dispatch:
  pull_request:
    paths:
      - stripe-links.json
      - src/config/pricing.ts
      - tools/check-stripe.mjs

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stripe links
        env:
          STRIPE_READ_KEY: ${{ secrets.STRIPE_READ_KEY }}
        run: |
          if [ -z "$STRIPE_READ_KEY" ]; then
            echo "::warning::STRIPE_READ_KEY is not set, so the Stripe check was skipped"
            exit 0
          fi
          set -o pipefail
          node tools/check-stripe.mjs | tee stripe-check.txt
      - name: Open an issue when the scheduled check fails
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Stripe price check failed"
          body="$(printf 'The Stripe check found a mismatch between Stripe and pricing.ts.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(cat stripe-check.txt 2>/dev/null)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
